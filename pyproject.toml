[build-system]
requires = [
    "setuptools>=77",
    "wheel"
]
build-backend = "setuptools.build_meta"
[project]
name = "irma"
version = "0.1.4"
authors = [
  { name="Manuel Eguia", email="me@lapso.org" },
]
description = "Acoustic measurement and analysis"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/meguia/irma"
Issues = "https://github.com/meguia/irma/issues"