[build-system]
requires = [
    "setuptools>=77",
    "wheel"
]
build-backend = "setuptools.build_meta"
[project]
name = "irma"
version = "0.2.0"
authors = [
  { name="Manuel Eguia", email="me@lapso.org" },
]
description = "Acoustic measurement and analysis"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]

# Runtime dependencies (aligned with requirements.txt)
dependencies = [
  "numpy>=1.24.3",
  "scipy>=1.10.1",
  "matplotlib>=3.7.1",
  "PyYAML>=6.0",
  "ipython>=7.31.1",
  "customtkinter>=5.1.3",
  "sounddevice>=0.4.6",
]

[project.urls]
Homepage = "https://github.com/meguia/irma"
Issues = "https://github.com/meguia/irma/issues"